[package]
name = "lantern"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
nimble = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"

[package]
name = "nimble"
version = "0.1.1"
edition = "2024"

[dependencies]
miette = { version = "7", features = ["derive", "fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
rustyline = "15"
inkwell = { version = "0.5", optional = true }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
serde_json = "1"
dashmap = "6"
dirs = "5"
rand = "0.10.1"

[features]
default = []
jit = ["dep:inkwell"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values())'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compiler_perf"
path = "benches/compiler_perf.rs"
harness = false
